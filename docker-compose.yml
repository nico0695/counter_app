version: "3.9"
services:
  app:
    build: .
    container_name: counter_app
    ports:
      - "3010:3000"
    volumes:
      - sqlite-data:/data
    environment:
      - DATABASE_URL=file:/data/dev.db
      - NODE_ENV=production
      - PORT=3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3010
    restart: unless-stopped
    networks:
      default:

volumes:
  sqlite-data:

networks:
  default:
    external: true
    name: public_networ