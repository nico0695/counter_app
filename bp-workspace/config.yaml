version: "1.0.0"
product:
  name: "counter_app"
  domain: >-
    Countdown Generator — a Next.js web app that lets registered users create and publish
    customizable countdown/event pages (title, description, background image or video,
    target date and timezone, visual style, social links) at public shareable URLs, with
    an admin dashboard for managing counters and users (role-based: USER capped by
    maxCounters, ADMIN unrestricted).
  glossary:
    Counter: "The core content entity — a countdown to a target date, identified by a unique slug and published at /{locale}/{slug}."
    Counter style / variant: "One of the pluggable visual countdown renderers (colon, blocks, flipclock, ring, bar, glass, segmentlcd) registered in lib/counterOptions.ts and components/counters/index.ts."
    Slug: "URL-safe unique identifier for a counter's public page, auto-generated from its title with collision suffixing."
