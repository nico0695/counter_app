version: "0.1"
project:
  name: counter_app
  slug: counter-app
  root: /opt/micloud/filebrowser/srv/dev_workspace/github/projects/counter_app/repo
  package_root: harness/sdd-lite
  runtime_root: ./sdd-lite
  stack:
    languages:
      - typescript
    frameworks:
      - nextjs
      - prisma
      - nextauth
      - next-intl
      - zustand
    runtime: node
    package_manager: pnpm

paths:
  runtime_root: ./sdd-lite
  project_context_path: ./sdd-lite/project-context.md
  skill_catalog_path: ./sdd-lite/skill-catalog.md
  artifact_root: ./sdd-lite/openspec
  config_path: ./sdd-lite/openspec/config.yaml
  changes_root: ./sdd-lite/openspec/changes
  reviews_root: ./sdd-lite/openspec/reviews
  archive_root: ./sdd-lite/openspec/archive
  delivery_root: ./sdd-lite/openspec/delivery

archive:
  suggest_threshold: 15
  stale_days: 30

delivery:
  base_branch: main
  pr_suggest_min_commits: 3

quality_commands:
  install:
    - pnpm install
  test: []
  build:
    - pnpm build
  lint:
    - pnpm lint
  typecheck:
    - pnpm type-check
  format:
    - pnpm format

bootstrap:
  status: refreshed
  strategy: shallow-high-signal
  generated_at: "2026-08-04T14:54:43Z"
  generated_by: sddl-init
  last_validated_at: "2026-08-22T21:23:23Z"
  refresh_recommended: false
  refresh_reason_codes: []
  observed_files:
    manifests:
      - package.json
    lockfiles:
      - pnpm-lock.yaml
    docs:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/dev/architecture.md
      - docs/dev/contributing.md
      - docs/business/product-overview.md
      - docs/business/features-and-rules.md
    tool_configs:
      - tsconfig.json
      - eslint.config.mjs
      - .prettierrc
  observed_paths:
    source_roots:
      - app
      - components
      - lib
      - interfaces
      - store
      - consts
      - styles
    test_roots: []
    config_roots:
      - .
      - docs

conventions:
  persisted_language: en
  persisted_artifacts_english_only: true
